<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src data:; base-uri 'none'; form-action 'none'">
<title>英語ドリル</title>
<style>
:root{--bg:#f3f1ec;--surface:#fffdf9;--ink:#1d2a26;--sub:#66726d;--line:#d9d5cb;--accent:#1f6f5c;--accent-ink:#fff;--ok:#1f7a45;--ng:#b3372f;--okbg:#e3f3e8;--ngbg:#f8e4e1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a18;--surface:#1c2421;--ink:#eaf0ed;--sub:#93a19b;--line:#33403b;--accent:#5fc4a8;--accent-ink:#0d1a16;--ok:#7bd59d;--ng:#f0948c;--okbg:#1c3327;--ngbg:#3a2220}}
:root[data-theme="dark"]{--bg:#141a18;--surface:#1c2421;--ink:#eaf0ed;--sub:#93a19b;--line:#33403b;--accent:#5fc4a8;--accent-ink:#0d1a16;--ok:#7bd59d;--ng:#f0948c;--okbg:#1c3327;--ngbg:#3a2220}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.25rem;margin:8px 0 18px;letter-spacing:.04em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
label{display:block;font-size:.9rem;color:var(--sub);margin-bottom:6px}
input[type=number],input[type=text],textarea{width:100%;font:inherit;font-size:1.05rem;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
textarea{min-height:150px;font-family:ui-monospace,Consolas,monospace;font-size:.9rem}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:10px;border:1.5px solid var(--accent);padding:12px 18px;background:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;color:var(--accent)}
button.big{width:100%;font-size:1.1rem;padding:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:1}
.meta{display:flex;justify-content:space-between;color:var(--sub);font-size:.9rem;margin-bottom:10px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.q{font-size:1.9rem;font-weight:700;text-align:center;margin:18px 0 22px;word-break:break-word}
.fb{margin:14px 0;padding:12px 14px;border-radius:10px;font-weight:600}
.fb.ok{background:var(--okbg);color:var(--ok)}
.inrow{display:flex;gap:8px}
.hint{margin:10px 0 0;padding-left:1.2em}
.ex{margin:10px 0 0;padding:10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow-x:auto;white-space:pre;font-family:ui-monospace,Consolas,monospace}
.ipa{margin:10px 0 0;text-align:center;font-size:1.15rem;color:var(--sub);font-family:"Segoe UI","Noto Sans","DejaVu Sans",system-ui,sans-serif;word-break:break-word}
select{width:100%;font:inherit;font-size:1.05rem;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
#mic{flex:0 0 auto;white-space:nowrap;padding:10px 14px}
#mic.on{background:var(--ng);border-color:var(--ng);color:#fff}
.fb.ng{background:var(--ngbg);color:var(--ng)}
.fb .ans{display:block;font-size:1.25rem;margin-top:2px;color:var(--ink)}
.score{font-size:3rem;font-weight:700;text-align:center;margin:6px 0}
.center{text-align:center}
.small{font-size:.85rem;color:var(--sub)}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>英語ドリル(日本語 → 英語)</h1>

<section id="setup">
  <div class="card">
    <label for="n">出題数</label>
    <input type="number" id="n" min="1" value="10" inputmode="numeric">
    <label for="range">出題範囲</label>
    <select id="range"></select>
    <p class="small" id="count"></p>
    <label for="acc">発音</label>
    <select id="acc"><option value="us">アメリカ</option><option value="uk">イギリス</option></select>
    <label id="autolbl" style="display:flex;gap:8px;align-items:center;margin:0 0 14px"><input type="checkbox" id="auto" checked>正解を読み上げる</label>
    <button class="big" id="start">スタート</button>
  </div>
  <div class="card">
    <label for="file">問題データ</label>
    <textarea id="data" class="hide" aria-hidden="true"></textarea>
    <div class="row">
      <button class="ghost" id="file">CSVを読み込む</button>
      <button class="ghost" id="clear">全データを削除</button>
    </div>
    <p class="small" id="msg"></p>
    <input type="file" id="fi" accept=".csv,.txt,.tsv,text/plain,text/csv" class="hide">
    <ul class="small hint">
      <li>日本語が同じ行は更新、新しい行は追加</li>
      <li>3列目以降は省略可(発音記号、#グループ)</li>
      <li>正解が複数:英語を「 / 」で区切る</li>
      <li>英語にカンマがある場合:" で囲む</li>
    </ul>
    <p class="small" style="margin:12px 0 0">CSVの例(登録済みのデータではありません)</p>
    <pre class="small ex">犬,dog
酸っぱい！,It's tart! / It's sour!,#2026-11-21
元気です,"Good, thank you.",[ɡʊd θæŋk juː]</pre>
  </div>
</section>

<section id="quiz" class="hide">
  <div class="card">
    <div class="meta"><span id="phase"></span><span id="prog"></span></div>
    <div class="bar"><i id="pb" style="width:0"></i></div>
    <div class="q" id="jp"></div>
    <div class="inrow"><input type="text" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="英語で入力" aria-label="英語で入力"><button type="button" class="ghost" id="mic">🎤 音声</button></div>
    <p class="small" id="micmsg"></p>
    <div id="fb" class="fb hide" role="status"></div>
    <div id="ipa" class="ipa hide"></div>
    <button type="button" class="ghost big hide" id="spk" style="margin-top:12px">🔊 正解を聞く</button>
    <button class="big" id="go" style="margin-top:12px">答え合わせ</button>
  </div>
  <button class="ghost" id="quit">やめる</button>
</section>

<section id="result" class="hide">
  <div class="card center">
    <div id="rtitle" style="font-weight:700"></div>
    <div class="score" id="rscore"></div>
    <p id="rtext" class="small"></p>
    <button class="big" id="rnext"></button>
  </div>
  <button class="ghost" id="rhome">最初に戻る</button>
</section>
<p class="small center" style="margin-top:24px">発音データ:CMU Pronouncing Dictionary(Carnegie Mellon University)、Britfone</p>
</main>

<script>
const SAMPLE="りんご,apple\n犬,dog\n猫,cat\n本,book\n水,water\n学校,school\n友達,friend\n電車,train\n朝食,breakfast\n図書館,library\n天気,weather\n医者,doctor\n";
const $=id=>document.getElementById(id);
let words=[],S=null;

function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function fields(l,d){
  const f=[];let c="",q=false;
  for(let i=0;i<l.length;i++){
    const ch=l[i];
    if(q){if(ch==='"'){if(l[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch===d){f.push(c);c=""}
    else if(ch==='"'&&c.trim()===""){q=true;c=""}
    else c+=ch;
  }
  f.push(c);return f;
}
function parse(t){
  const out=[];
  t.split(/\r?\n/).forEach((l,i)=>{
    l=l.trim();if(!l)return;
    const d=l.includes("\t")?"\t":(l.includes(",")?",":"，");
    const f=fields(l,d);
    if(f.length<2)return;
    const jp=f.shift().trim();
    let g="",ip="";
    while(f.length>1){
      const x=f[f.length-1].trim();
      if(!x){}
      else if(!g&&/^#./.test(x))g=x.slice(1).trim();
      else if(!ip&&/^(\/.+\/|\[.+\])$/.test(x))ip=x;
      else break;
      f.pop();
    }
    if(d==="\t"&&!g&&f.length>=2)g=f.pop().trim();
    const en=f.join(d).trim().replace(/[,，]+$/,"").trim();
    if(i===0&&jp==="日本語")return;
    if(jp&&en)out.push({jp,en,g,p:ip});
  });
  return out;
}
function load(){
  const sv=store("td_data");$("data").value=sv===null?SAMPLE:sv;
  const n=store("td_n");if(n)$("n").value=n;
  words=parse($("data").value);refresh();
}
function groups(){const g=[];words.forEach(w=>{if(w.g&&!g.includes(w.g))g.push(w.g)});return g.sort((a,b)=>b.localeCompare(a,"ja",{numeric:true}))}
function pool(){
  const v=$("range").value;if(!v||v==="all")return words;
  const g=v.slice(2);
  return words.filter(w=>w.g===g);
}
function refresh(){
  const sel=$("range"),cur=sel.value||store("td_range")||"all",gs=groups();
  const c=g=>words.filter(w=>w.g===g).length;
  sel.innerHTML="";
  const add=(v,t)=>{const o=document.createElement("option");o.value=v;o.textContent=t;sel.appendChild(o)};
  add("all","すべて ("+words.length+"問)");
  gs.forEach(g=>add("g:"+g,g+" ("+c(g)+"問)"));
  sel.value=[...sel.options].some(o=>o.value===cur)?cur:"all";
  $("count").textContent="登録問題数:"+words.length+"問 / 出題範囲:"+pool().length+"問";
}
function show(id){["setup","quiz","result"].forEach(s=>$(s).classList.toggle("hide",s!==id))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const norm=s=>s.normalize("NFKC").toLowerCase().replace(/[’‘`']/g,"").replace(/[-‐‑–]/g," ").replace(/[.,!?;:"“”()]/g,"").replace(/\s+/g," ").trim();
const accepted=en=>en.split(/\s+[\/／]\s+|\s*[|｜]\s*/).map(norm).filter(Boolean);

const qf=s=>/[",\t\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
function toLine(w){return [qf(w.jp),qf(w.en)].concat(w.p?[w.p]:[],w.g?["#"+w.g]:[]).join(",")}
let D={us:null,uk:null},dictP=null;
function getJson(f){return fetch(f).then(r=>{if(!r.ok)throw 0;return r.json()}).catch(()=>null)}
function loadDicts(){
  if(!words.some(w=>!w.p))return Promise.resolve();
  if(!dictP)dictP=Promise.all([getJson("cmudict-ipa.json"),getJson("britfone-ipa.json")]).then(r=>{D.us=r[0];D.uk=r[1]});
  return dictP;
}
function ipaFor(en){
  const us=D.us,uk=$("acc").value==="uk"?D.uk:null;
  if(!us&&!uk)return "";
  let fb=false;
  const r=en.split(/\s+[\/／]\s+|\s*[|｜]\s*/).filter(Boolean).map(a=>{
    const ws=a.toLowerCase().replace(/[’‘]/g,"'").match(/[a-z]+(?:'[a-z]+)*/g)||[];
    if(!ws.length)return "";
    return "["+ws.map(x=>{
      if(uk&&uk[x])return uk[x];
      if(us&&us[x]){if(uk){fb=true;return us[x]+"*"}return us[x]}
      return "?";
    }).join(" ")+"]";
  }).filter(Boolean).join(" / ");
  return r+(r&&fb?" (*=米)":"");
}
function doSave(note){
  const w=parse($("data").value);
  if(!w.length){$("msg").textContent="読み取れる行がありません。";return}
  words=w;store("td_data",$("data").value);refresh();
  $("msg").textContent=w.length+"問を保存しました。"+(note||"");
}
$("clear").onclick=()=>{
  if(!confirm("すべての問題データを削除しますか?"))return;
  $("data").value="";words=[];store("td_data","");refresh();$("msg").textContent="削除しました。";
};
$("file").onclick=()=>$("fi").click();
$("fi").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  f.arrayBuffer().then(b=>{
    let t;
    try{t=new TextDecoder("utf-8",{fatal:true}).decode(b)}catch(_){t=new TextDecoder("shift_jis").decode(b)}
    t=t.replace(/^\uFEFF/,"");
    const cur=parse($("data").value),idx=new Map(cur.map((w,i)=>[w.jp,i]));
    let add=0,upd=0;
    parse(t).forEach(w=>{
      const k=idx.get(w.jp);
      if(k===undefined){idx.set(w.jp,cur.length);cur.push(w);add++}
      else{const o=cur[k],ch=o.en!==w.en;if(ch)upd++;o.p=w.p||(ch?"":o.p);o.en=w.en;o.g=w.g||o.g}
    });
    $("data").value=cur.map(toLine).join("\n");
    doSave("(CSV:追加"+add+"件・更新"+upd+"件)");
  });
  e.target.value="";
};

$("start").onclick=async()=>{
  if(!words.length){alert("先にCSVを読み込んでください。");return}
  let n=parseInt($("n").value,10);if(!(n>0))n=10;store("td_n",String(n));
  const pl=pool();if(!pl.length){$("msg").textContent="この範囲に問題がありません。";return}
  n=Math.min(n,pl.length);
  await loadDicts();
  S={total:n,score:0,queue:shuffle(pl).slice(0,n),wrong:[],round:0,main:true,done:0,len:n,cur:null,answered:false};
  next();
};

function next(){
  if(!S.queue.length)return endRound();
  S.cur=S.queue.shift();S.answered=false;
  show("quiz");
  $("phase").textContent=S.main?"本番":"復習 "+S.round+"周目";
  $("prog").textContent=(S.done+1)+" / "+S.len;
  $("pb").style.width=(S.done/S.len*100)+"%";
  $("jp").textContent=S.cur.jp;$("jp").style.fontSize=S.cur.jp.length>18?"1.25rem":"";
  $("ans").value="";$("ans").readOnly=false;
  $("fb").classList.add("hide");$("spk").classList.add("hide");$("ipa").classList.add("hide");try{speechSynthesis.cancel()}catch(_){}
  $("go").textContent="答え合わせ";
  $("ans").focus();
}
function check(){
  const v=norm($("ans").value);
  if(!v){$("ans").focus();return}
  const ok=accepted(S.cur.en).includes(v);
  S.answered=true;$("ans").readOnly=true;
  const fb=$("fb");fb.classList.remove("hide","ok","ng");
  if(ok){fb.classList.add("ok");fb.innerHTML="正解!<span class=\"ans\"></span>";fb.querySelector(".ans").textContent=S.cur.en;if(S.main)S.score++}
  else{fb.classList.add("ng");fb.innerHTML="不正解<span class=\"ans\"></span>";fb.querySelector(".ans").textContent="正解:"+S.cur.en;S.wrong.push(S.cur)}
  S.done++;
  const ip=S.cur.p||ipaFor(S.cur.en);$("ipa").textContent=ip;$("ipa").classList.toggle("hide",!ip);
  if(window.speechSynthesis){$("spk").classList.remove("hide");if($("auto").checked)speak(ansText())}
  $("pb").style.width=(S.done/S.len*100)+"%";
  $("go").textContent=(S.queue.length?"次の問題":"結果を見る");
  $("go").focus();
}
$("go").onclick=()=>S.answered?next():check();
$("ans").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing&&!S.answered){e.preventDefault();check()}});
$("quit").onclick=()=>{if(confirm("中断して最初に戻りますか?"))show("setup")};
$("rhome").onclick=()=>show("setup");

function endRound(){
  show("result");
  const w=S.wrong.length;
  if(S.main){
    $("rtitle").textContent="総合点";
    $("rscore").textContent=S.score+" / "+S.total;
    $("rtext").textContent=Math.round(S.score/S.total*100)+"点(100点満点)";
    if(w){$("rtext").textContent+=" ・ 間違い "+w+"問";$("rnext").textContent="間違えた問題を復習する";$("rnext").onclick=()=>startRetry()}
    else{$("rtext").textContent+=" ・ 全問正解です";$("rnext").textContent="もう一度出題する";$("rnext").onclick=()=>$("start").click()}
    S.main=false;
  }else if(w){
    $("rtitle").textContent="復習 "+S.round+"周目 終了";
    $("rscore").textContent="残り "+w+" 問";
    $("rtext").textContent="全問正解するまで繰り返します。";
    $("rnext").textContent="もう一度復習する";$("rnext").onclick=()=>startRetry();
  }else{
    $("rtitle").textContent="復習完了";
    $("rscore").textContent="全問クリア";
    $("rtext").textContent="本番の総合点:"+S.score+" / "+S.total;
    $("rnext").textContent="もう一度出題する";$("rnext").onclick=()=>$("start").click();
  }
}
function startRetry(){
  S.queue=shuffle(S.wrong);S.wrong=[];S.round++;S.done=0;S.len=S.queue.length;next();
}
/* 音声入力(Web Speech API) */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,listening=false;
const mic=$("mic");
function stopMic(){if(listening&&rec){try{rec.abort()}catch(_){}}}
if(!SR){mic.classList.add("hide")}
else{
  mic.onclick=()=>{
    if(!S||S.answered)return;
    if(listening){try{rec.stop()}catch(_){}return}
    $("micmsg").textContent="";
    rec=new SR();rec.lang=$("acc").value==="uk"?"en-GB":"en-US";rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;
    rec.onstart=()=>{listening=true;mic.classList.add("on");mic.textContent="■ 停止"};
    rec.onresult=e=>{
      if(!S||S.answered)return;
      let t="";for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;
      $("ans").value=t.trim();
    };
    rec.onerror=e=>{
      const m={"not-allowed":"マイクの使用が許可されていません。ブラウザの設定で許可してください。","service-not-allowed":"この環境では音声認識を使えません。","no-speech":"音声が聞き取れませんでした。もう一度お試しください。","network":"音声認識にはインターネット接続が必要です。","audio-capture":"マイクが見つかりません。"};
      $("micmsg").textContent=m[e.error]||("音声認識でエラーが発生しました("+e.error+")");
    };
    rec.onend=()=>{listening=false;mic.classList.remove("on");mic.textContent="🎤 音声"};
    try{rec.start()}catch(_){}
  };
  $("go").addEventListener("click",stopMic);
}
/* 音声出力(Web Speech API) */
function ansText(){return S.cur.en.split(/\s+[\/／]\s+|\s*[|｜]\s*/).filter(Boolean)}
function speak(t){
  if(!window.speechSynthesis)return;
  try{speechSynthesis.cancel();[].concat(t).forEach(x=>{const u=new SpeechSynthesisUtterance(x);u.lang=$("acc").value==="uk"?"en-GB":"en-US";u.rate=0.9;speechSynthesis.speak(u)})}catch(_){}
}
$("spk").onclick=()=>speak(ansText());
$("range").onchange=()=>{store("td_range",$("range").value);refresh()};
if(!window.speechSynthesis)$("autolbl").classList.add("hide");
$("auto").checked=store("td_tts")!=="0";
$("auto").onchange=()=>store("td_tts",$("auto").checked?"1":"0");
if(store("td_acc")==="uk")$("acc").value="uk";
$("acc").onchange=()=>store("td_acc",$("acc").value);
load();
</script>
</body>
</html>
